version: '3.8'

services:
  mongodb:
    image: mongo:8.0
    container_name: vaultguard-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: vaultguard
    volumes:
      - mongo_data:/data/db

  vault:
    image: hashicorp/vault:1.15.6
    container_name: vaultguard-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root-master-token-vg2026
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault/config:/vault/config
      - ./vault/policies:/vault/policies
      - ./vault/logs:/vault/logs
      - vault_data:/vault/data
    command: ["server", "-dev", "-dev-root-token-id=root-master-token-vg2026", "-dev-listen-address=0.0.0.0:8200"]

volumes:
  mongo_data:
  vault_data:

