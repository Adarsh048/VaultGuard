version: '3.8'

# NOTE: Vault dev server mode and unauthenticated MongoDB are designed for isolated
# local development and demonstration only. For production, deploy hardened production
# MongoDB clusters with TLS/auth and multi-node Shamir unsealed Vault instances.

services:
  mongodb:
    image: mongo:8.0
    container_name: vaultguard-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: vaultguard
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vaultguard-network

  vault:
    image: hashicorp/vault:1.15.6
    container_name: vaultguard-vault
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_API_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault/config:/vault/config:ro
      - ./vault/policies:/vault/policies:ro
      - ./vault/logs:/vault/logs
      - vault_data:/vault/data
    command: ["server", "-config=/vault/config/vault.hcl"]
    healthcheck:
      # Returns 0 when unsealed and active, ensuring dependent services wait until operator unseals Vault
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - vaultguard-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vaultguard-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/vaultguard
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured explicitly in .env (minimum 32 characters)}
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
      VAULT_APP_TOKEN: ${VAULT_APP_TOKEN:-}
      VAULT_KV_MOUNT: secret
      VAULT_AUDIT_LOG_PATH: /vault/logs/vault_audit.log
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - ./vault/logs:/vault/logs:ro
    depends_on:
      mongodb:
        condition: service_healthy
      vault:
        condition: service_healthy
    networks:
      - vaultguard-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vaultguard-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    networks:
      - vaultguard-network

networks:
  vaultguard-network:
    driver: bridge

volumes:
  mongo_data:
  vault_data:
